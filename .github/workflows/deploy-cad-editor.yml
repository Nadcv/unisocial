name: Deploy CAD Modular to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'cad-editor/**'
      - '.github/workflows/deploy-cad-editor.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cad-editor/package-lock.json
      - name: Install dependencies
        working-directory: cad-editor
        run: npm ci
      - name: Build
        working-directory: cad-editor
        run: npx vite build --base=./
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cad-editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
