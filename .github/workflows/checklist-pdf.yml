name: Checklist PDF - gerar e enviar

on:
  schedule:
    # Todos os dias às 7h e às 17h (hora de Portugal, UTC+0/+1 conforme DST).
    # Para mudar a frequência, edite estas linhas cron (formato UTC).
    - cron: "0 7 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch: {}

jobs:
  gerar-e-enviar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checklist-pdf-python
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências de sistema do WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            libffi-dev shared-mime-info fonts-liberation

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Gerar PDFs e enviar e-mails
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINATARIOS_EXTRA: ${{ secrets.EMAIL_DESTINATARIOS_EXTRA }}
        run: python gerar_e_enviar.py
